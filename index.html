<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Flame Jumper: an endless runner where you jump over falling meteors.">
  <meta name="theme-color" content="#020024">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="icon" type="image/png" href="/src/assets/images/favicon/favicon.png">
  <link rel="manifest" href="/game-jumper/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/game-jumper/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Flame Jumper</title>
</head>
<body>
  <main class="game">
    <canvas id="gameCanvas" width="500" height="500" aria-label="Flame Jumper game"></canvas>

    <aside class="info">
      <h1 class="info__name">Flame Jumper</h1>
      <h2 class="info__settings">How to play 💡</h2>
      <ul class="info__list">
        <li><span>SPACE / ↑ / TAP</span> jump, hold for a higher jump</li>
        <li><span>↓ / SWIPE DOWN</span> duck under low meteors</li>
        <li><span>ENTER</span> start, <span>ESC</span> back</li>
        <li><span>ESC / P</span> pause, <span>M</span> mute</li>
        <li><span>S</span> stats, <span>A</span> awards, <span>C</span> character</li>
      </ul>
    </aside>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
